<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle residencial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Controle residencial</h1>

        <div id="lampada" class="lampada apagada">
            💡
        </div>

        <p id="status">Lâmpada desligada</p>

        <button id="botao">
            LIGAR
        </button>

        <section class="sensores">

            <button id="sensor-presenca">
                SENSOR DO QUARTO
            </button>

            <button id="sensor-fumaca">
                SENSOR DE FUMAÇA
            </button>

            <button id="campainha">
                CAMPAINHA
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
